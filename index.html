<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Rutinas de cada alumno y clases funcionales de Inquieta.">
<meta name="theme-color" content="#1F2937" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inquieta">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<title>Inquieta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 600; font-display: swap; src: url("fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-style: normal; font-weight: 800; font-display: swap; src: url("fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
:root { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: ficha de gimnasio — banda grafito con la marca, tarjetas de rutina y series en grande para leer de lejos */
:root {
  --bg: #F3F5F7;
  --surface: #FFFFFF;
  --text: #0F1217;
  --muted: #5A6472;
  --line: #DCE1E7;
  --head: #1F2937;
  --head-text: #F9FAFB;
  --brand: #00CFCB;
  --brand-ink: #04211F;
  --brand-text: #008E8A;
  --brand-soft: #DDF7F6;
  --amber: #FEF3C7;
  --amber-line: #F1DD9C;
  --rest: #CBD2DA;
  --badge: #1F2937;
  --badge-text: #F9FAFB;
  --chip: #1F2937;
  --today: #FDE047;
  --today-ink: #2E2500;
  --danger: #C8322A;
  --warn-bg: #FDECEC;
  --warn-ink: #8B1D1D;
  --chip-text: #F9FAFB;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 2px 8px rgba(16, 24, 40, .06);
  --display: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E13; --surface: #151A22; --text: #F2F4F7; --muted: #9AA4B2; --line: #283243;
    --head: #10151C; --head-text: #F2F4F7; --brand: #1FD8D3; --brand-ink: #03201F; --brand-text: #45E2DD; --brand-soft: #0E2F30;
    --amber: #2B2513; --amber-line: #3D3419; --rest: #3A4556; --badge: #1FD8D3; --badge-text: #03201F; --chip: #2E3A4E; --chip-text: #F2F4F7; --today: #FACC15; --today-ink: #221B00; --danger: #FF7A70; --warn-bg: #3A1818; --warn-ink: #FFCACA;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E13; --surface: #151A22; --text: #F2F4F7; --muted: #9AA4B2; --line: #283243;
  --head: #10151C; --head-text: #F2F4F7; --brand: #1FD8D3; --brand-ink: #03201F; --brand-text: #45E2DD; --brand-soft: #0E2F30;
  --amber: #2B2513; --amber-line: #3D3419; --rest: #3A4556; --badge: #1FD8D3; --badge-text: #03201F; --chip: #2E3A4E; --chip-text: #F2F4F7; --today: #FACC15; --today-ink: #221B00; --danger: #FF7A70; --warn-bg: #3A1818; --warn-ink: #FFCACA;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font: 17px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

/* encabezados */
.marca { background: var(--head); color: var(--head-text); }
.marca .wrap { padding-block: 22px 18px; }
.marca img { display: block; height: 32px; width: auto; }
.marca .eti { margin-top: 10px; font: 700 12px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--brand); }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-text); }
.barra .wrap { display: flex; align-items: center; gap: 6px; min-height: 56px; padding-block: 6px; }
.barra h1 { font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.volver { width: 44px; height: 44px; margin-left: -10px; display: grid; place-items: center; border-radius: 12px; color: var(--head-text); }
.volver svg { width: 24px; height: 24px; }

/* lista */
.intro { color: var(--muted); font-size: 14px; margin: 16px 0 4px; }
.lista { display: grid; gap: 10px; margin: 12px 0 0; padding: 0; list-style: none; }
.tarjeta { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.tarjeta:active { transform: scale(.99); }
.letra { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--badge); color: var(--badge-text); font: 800 24px/1 var(--display); }
.tarjeta h2 { font-size: 17px; line-height: 1.25; }
.meta { margin-top: 3px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ejs { margin-top: 4px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--muted); font-size: 24px; }

/* detalle */
.hero { display: flex; gap: 14px; align-items: center; margin: 18px 0 6px; }
.hero .letra { width: 64px; height: 64px; font-size: 30px; border-radius: 16px; flex: 0 0 64px; }
.ceja { font: 700 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--brand-text); }
.hero h2 { font-size: 24px; margin-top: 6px; line-height: 1.15; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.pill { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 15px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.br { background: var(--brand-soft); border-color: transparent; }
.sec { margin: 24px 0 8px; font: 800 12px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.sec::after { content: ""; display: block; width: 26px; height: 3px; border-radius: 2px; background: var(--brand); margin-top: 7px; }
.nota { background: var(--brand-soft); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.cal { margin: 0; padding: 12px 14px 12px 34px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); }
.cal li { margin: 3px 0; }
.ej { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ej li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; background: var(--surface); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.num { font: 800 15px/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.nom { font-weight: 700; font-size: 17px; line-height: 1.3; }
.sxr { font: 800 22px/1 var(--display); white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--amber); border: 1px solid var(--amber-line); border-radius: 10px; padding: 7px 10px; }
.sxr small { font-size: 13px; font-weight: 700; }
.det { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; color: var(--muted); }
.desc { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--text); }
.desc svg { width: 15px; height: 15px; color: var(--brand-text); }
.tip { grid-column: 2 / 4; font-size: 14px; color: var(--muted); }

/* bloques de clase */
.bloque { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 10px; }
.bl-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bl-h h3 { font-size: 17px; }
.modo { flex: 0 0 auto; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 12px; background: var(--chip); color: var(--chip-text); }
.int { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 12px 0 6px; }
.int .t { background: var(--brand); }
.int .d { background: var(--rest); }
.int-l { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.int-l span:last-child { color: var(--muted); }
.bl-m { margin-top: 6px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.amrap { display: inline-block; margin-top: 10px; font: 800 22px/1 var(--display); background: var(--amber); border: 1px solid var(--amber-line); border-radius: 10px; padding: 7px 10px; }
.bl-ej { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 0; }
.bl-ej li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-weight: 600; }
.avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); font: 800 18px/1 var(--display); }
.avatar.grande { width: 64px; height: 64px; flex: 0 0 64px; font-size: 22px; }
.tag { display: inline-block; vertical-align: 2px; margin-left: 4px; font: 800 10px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; border-radius: 6px; background: var(--chip); color: var(--chip-text); }
.salud { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--warn-bg); color: var(--warn-ink); font-weight: 700; font-size: 15px; }
.buscar { display: block; margin: 12px 0 0; }
.buscar input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 17px var(--body); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.vacio { color: var(--muted); text-align: center; padding: 24px 0; }
.tabs .in { grid-template-columns: repeat(2, 1fr) !important; }
.ejrs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ejr { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.ejr-h { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.ult { margin-top: 10px; }
.ult-t { font: 800 11px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--brand-text); margin-bottom: 6px; }
.hizo { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.hizo span { font: 800 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.series { display: flex; flex-wrap: wrap; gap: 6px; }
.se { display: inline-flex; align-items: baseline; gap: 6px; background: var(--amber); border: 1px solid var(--amber-line); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; max-width: 100%; overflow-wrap: anywhere; }
.se b { font: 800 12px/1 var(--display); color: var(--muted); }
.se.cal { background: var(--surface); border-color: var(--line); }
.reps { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
details { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--brand-text); min-height: 32px; display: flex; align-items: center; }
.hist { margin-top: 10px; }
.pr { display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.plan { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); }
.plan li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); font-size: 15px; }
.plan li:first-child { border-top: 0; }
.aviso { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--amber); border: 1px solid var(--amber-line); font-size: 15px; }
.letra.chica { font-size: 13px; letter-spacing: .02em; }
.ev { font-size: 15px; font-weight: 700; color: var(--brand-text); margin-bottom: 6px; }
.ev span { font: 800 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; }
.ev b { color: var(--text); }
.ult-t.gris, .gris { color: var(--muted); }
.prox { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--amber); border: 1px solid var(--amber-line); font-size: 15px; display: grid; gap: 4px; }
.prox b { font: 800 11px/1.3 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.vista > .nota { margin-top: 12px; }
.plan-ej { display: inline-block; margin-top: 8px; padding: 4px 9px; border-radius: 8px; background: var(--brand-soft); font-size: 14px; font-weight: 700; }
.fbadge { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; align-content: center; background: var(--badge); color: var(--badge-text); font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.fbadge small { font: 800 10px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 3px; opacity: .85; }
.hero .fbadge { width: 64px; height: 64px; flex: 0 0 64px; font-size: 26px; border-radius: 16px; }
.lado { display: flex; align-items: center; gap: 8px; }
.estado { display: inline-flex; align-items: center; min-height: 24px; padding: 0 9px; border-radius: 12px; font: 800 11px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.estado.ok { background: var(--brand-soft); color: var(--brand-text); border-color: transparent; }
.estado.hoy { background: var(--today); color: var(--today-ink); border-color: transparent; }
.estado.off { background: transparent; }
.pill.estado { min-height: 30px; font-size: 12px; }
.tarjeta.off { opacity: .6; box-shadow: none; border: 1px dashed var(--line); background: transparent; }
.esqueleto { opacity: .55; }
.esqueleto h2, .esqueleto .meta { background: var(--line); border-radius: 6px; width: 70%; }
.esqueleto .meta { width: 45%; margin-top: 8px; }
.vacio-caja { margin: 18px 0 0; padding: 18px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.vacio-caja h2 { font-size: 18px; margin-bottom: 6px; }
.vacio-caja p { margin: 0; color: var(--muted); }
.aviso-top { display: block; margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--amber); border: 1px solid var(--amber-line); font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none; }
/* edición */
.accion { flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .32); color: var(--head-text); font: 700 14px/1 var(--display); }
button.volver { background: none; border: 0; padding: 0; cursor: pointer; }
.btn, .btn-sec, .btn-ghost, .btn-peligro { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; padding: 0 16px; border-radius: 14px; font: 800 16px/1.1 var(--display); text-align: center; cursor: pointer; }
.btn { background: var(--brand); color: var(--brand-ink); border: 0; }
.btn:disabled { opacity: .6; }
.btn-sec { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
.btn-sec.on { background: var(--amber); border-color: var(--amber-line); }
.btn-ghost { margin-top: 12px; background: transparent; color: var(--brand-text); border: 1.5px dashed var(--line); }
.btn-ghost.arriba { margin: 0 0 10px; }
.btn-peligro { margin-top: 28px; background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn-peligro.on { background: var(--danger); color: #fff; border-color: transparent; }
.editor { padding-bottom: 24px; }
.campo { display: grid; gap: 6px; margin-top: 14px; min-width: 0; }
.campo > span { font: 800 11px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.campo small { font-size: 13px; color: var(--muted); }
.campo input, .campo textarea, .ed-caja > input { width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 16px/1.35 var(--body); }
.campo textarea { resize: vertical; }
.campo input:focus, .campo textarea:focus, .ed-caja > input:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; align-items: end; }
.g-letra { grid-template-columns: 84px minmax(0, 1fr); }
.chk { display: flex; align-items: center; gap: 10px; min-height: 46px; margin-top: 6px; font-size: 16px; }
.chk input { width: 22px; height: 22px; accent-color: var(--brand); flex: 0 0 22px; }
.chks { display: flex; flex-wrap: wrap; gap: 0 22px; }
.ed-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.ed-caja { background: var(--surface); border-radius: 16px; padding: 12px 14px 14px; box-shadow: var(--shadow); display: grid; gap: 8px; margin-bottom: 10px; }
.ed-lista .ed-caja { margin-bottom: 0; }
.ed-caja-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ed-caja-h + .campo, .ed-caja-h + .grid2 > .campo { margin-top: 2px; }
.ed-ord { display: flex; gap: 6px; }
.ed-ord button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 800 16px/1 var(--body); cursor: pointer; }
.ed-ord button:disabled { opacity: .3; cursor: default; }
.pie-ed { position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
body.editando .tabs { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: max-content; max-width: calc(100vw - 32px); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; background: var(--head); color: var(--head-text); padding: 12px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
/* versión app: instalar, respaldo y entrada con código */
.caja-app { margin: 14px 0 0; padding: 16px; border-radius: 16px; background: var(--brand-soft); display: grid; gap: 6px; }
.caja-app b { font: 800 16px/1.25 var(--display); }
.caja-app p { margin: 0; font-size: 15px; }
.fila-btn { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 8px; }
.fila-btn > :only-child { grid-column: 1 / -1; }
.fila-btn .btn-peligro { margin-top: 0; }
.nota-chica { margin: 8px 2px 0; font-size: 14px; color: var(--muted); }
.link-resp { display: block; margin: 26px 0 0; padding: 12px 0; text-align: center; font-size: 15px; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.archivo { position: relative; overflow: hidden; }
.oculto { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.error { margin: 10px 2px 0; color: var(--danger); font-weight: 700; font-size: 15px; }
.entrada form { margin-top: 4px; }
.entrada .btn { margin-top: 16px; }
.entrada input { font-size: 20px; letter-spacing: .08em; }
.intro.chica { margin-top: 22px; font-size: 15px; text-align: center; }
label.link { color: var(--brand-text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
body.entrada .tabs { display: none; }
.leyenda { margin: 22px 0 8px; font-size: 13px; color: var(--muted); }

/* barra de pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; color: var(--muted); font-size: 12px; font-weight: 700; position: relative; }
.tab svg { width: 25px; height: 25px; }
.tab.on { color: var(--text); }
.tab.on svg { color: var(--brand-text); }
.tab.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
@media (prefers-reduced-motion: no-preference) { .vista { animation: entra .18s ease-out; } @keyframes entra { from { opacity: .4; transform: translateY(6px); } } }
</style>

const TABS = [{ id: 'alumnos', t: 'Alumnos' }, { id: 'funcional', t: 'Funcional' }];
const COLS = ['alumnos', 'rutinas', 'clases', 'base'];
const CAL_CLASE = 'Activación con movilidad y estiramientos dinámicos';

/* ---------- utilidades ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const seg = (n) => (n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')} min` : `${n} s`);
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sept', 'oct', 'nov', 'dic'];
const DIA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const aFecha = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const HOY = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
const diaLargo = (s) => { const d = aFecha(s); return `${DIA[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]}`; };
const iniciales = (n) => String(n || '?').split(/\s+/).filter((w) => w.length > 1).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
const corto = (a) => (a.duo || !String(a.nombre).includes(' ') ? a.nombre : String(a.nombre).split(' ')[0]);
const clon = (x) => JSON.parse(JSON.stringify(x ?? null));
const nuevoId = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const lineas = (t) => String(t || '').split('\n').map((s) => s.trim()).filter(Boolean);
const numero = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return Number.isFinite(n) && n > 0 ? n : null; };
const coma = (n) => String(n).replace('.', ',');
const limpio = (s) => String(s ?? '').trim();
const esAmrap = (b) => /amrap/i.test(b.modo || '') || /amrap/i.test(b.nombre || '') || !!b.amrap;
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- estado ---------- */
const S = { alumnos: new Map(), rutinas: new Map(), clases: new Map(), base: new Map(), listo: {}, estado: 'cargando', lento: false, puede: null, soloLectura: false };
let db = null;
let BORRADOR = null;
let tabGuardada = 'alumnos';
try { tabGuardada = localStorage.getItem('inq-visor-tab3') || 'alumnos'; } catch (err) { /* sin almacenamiento */ }
const scrolls = {};

const hayDatos = () => COLS.some((c) => S[c].size);
const puedeEditar = () => !!db && S.puede !== false && !S.soloLectura;
const alumnos = () => [...S.alumnos.values()].sort((a, b) => (a.propia ? 1 : 0) - (b.propia ? 1 : 0) || String(a.nombre).localeCompare(String(b.nombre), 'es'));
const rutinasDe = (aid) => [...S.rutinas.values()].filter((r) => r.alumnoId === aid).sort((a, b) => String(a.letra).localeCompare(String(b.letra), 'es', { numeric: true }));
const clases = () => [...S.clases.values()].sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
const bases = () => [...S.base.values()].sort((a, b) => String(a.letra).localeCompare(String(b.letra), 'es', { numeric: true }));

const conDatos = (g) => !!g && !!(g.x || g.c || g.r || g.ev || (g.s && g.s.some(Boolean)));
function ultimoIdx(e) { const h = e.h || []; for (let i = h.length - 1; i >= 0; i--) if (conDatos(h[i])) return i; return -1; }
function ultimaSesion(w) { if (!w.ses || !w.ej) return ''; let m = -1; w.ej.forEach((e) => { m = Math.max(m, ultimoIdx(e)); }); return m >= 0 ? w.ses[m] : ''; }
const nEjR = (w) => (w.circuitos ? w.circuitos.reduce((s, c) => s + (c.ej || []).length, 0) : (w.ej || []).length);
const nEjC = (c) => (c.bloques || []).reduce((s, b) => s + (b.ej || []).length, 0);

/* ---------- rutas ---------- */
function ruta() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^editar-(alumnos|rutinas|clases|base)-(.+)$/))) return { edit: true, col: m[1], id: m[2], tab: m[1] === 'clases' || m[1] === 'base' ? 'funcional' : 'alumnos', clave: h };
  if ((m = h.match(/^nuevo-rutinas-(.+)$/))) return { edit: true, col: 'rutinas', nuevo: true, alumnoId: m[1], tab: 'alumnos', clave: h };
  if ((m = h.match(/^nuevo-(alumnos|clases|base)$/))) return { edit: true, col: m[1], nuevo: true, tab: m[1] === 'alumnos' ? 'alumnos' : 'funcional', clave: h };
  if (APP && h === 'respaldo') return { tab: 'alumnos', respaldo: true, clave: h };
  if (TABS.some((t) => t.id === h)) return { tab: h, clave: h };
  if (S.rutinas.has(h)) return { tab: 'alumnos', w: S.rutinas.get(h), clave: h };
  if (S.alumnos.has(h)) return { tab: 'alumnos', a: S.alumnos.get(h), clave: h };
  if (S.clases.has(h)) return { tab: 'funcional', c: S.clases.get(h), clave: h };
  if (S.base.has(h)) return { tab: 'funcional', c: { ...S.base.get(h), base: true }, clave: h };
  const tab = TABS.some((t) => t.id === tabGuardada) ? tabGuardada : 'alumnos';
  if (h && !TABS.some((t) => t.id === h) && S.estado !== 'listo') return { tab, espera: true, clave: h };
  return { tab, clave: tab };
}

/* ---------- piezas ---------- */
const marca = () => `<header class="marca"><div class="wrap"><img src="${LOGO}" alt="Inquieta" width="480" height="121"><div class="eti">Entrenamientos</div></div></header>`;
const barra = (href, titulo, accion = '') => `<header class="barra"><div class="wrap"><a class="volver" href="${href}" aria-label="Volver">${ICON.back}</a><h1>${esc(titulo)}</h1>${accion}</div></header>`;
const btnEditar = (col, id) => (puedeEditar() ? `<a class="accion" href="#editar-${col}-${esc(id)}">Editar</a>` : '');
const badge = (l) => { l = String(l || '?'); return `<span class="letra ${l.length > 1 ? 'chica' : ''}">${esc(l)}</span>`; };
const pl = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const fBadge = (s) => { const d = aFecha(s); return `<span class="fbadge"><small>${MES[d.getMonth()]}</small>${d.getDate()}</span>`; };
const saludHtml = (a) => (a && a.salud ? a.salud : []).map((t) => `<div class="salud">⚠ ${esc(t)}</div>`).join('');
function estadoClase(c) {
  if (c.feriado) return '<span class="estado off">Feriado</span>';
  if (c.fecha === HOY) return '<span class="estado hoy">Hoy</span>';
  if (c.hecha) return '<span class="estado ok">Realizada</span>';
  if (c.fecha > HOY) return '<span class="estado">Por hacer</span>';
  return '';
}
function aviso() {
  if (S.estado === 'error' && hayDatos()) return '<div class="wrap"><div class="aviso-top">No se pudo actualizar. Lo que ves puede no estar al día.</div></div>';
  if (S.lento && hayDatos()) return '<div class="wrap"><div class="aviso-top">Conexión lenta: lo que ves puede no estar al día.</div></div>';
  return '';
}

/* ---------- estados de carga ---------- */
const vistaCargando = () => `${marca()}<div class="wrap vista"><p class="intro">${S.lento ? 'No se pudo conectar todavía. Revisa tu conexión; la página sigue intentando.' : 'Cargando entrenamientos…'}</p>
  <ul class="lista">${[1, 2, 3].map(() => '<li><div class="tarjeta esqueleto"><span class="avatar"></span><span><h2>&nbsp;</h2><div class="meta">&nbsp;</div></span><span></span></div></li>').join('')}</ul></div>`;
const vistaSinDb = () => `${marca()}<div class="wrap vista"><div class="vacio-caja"><h2>Abre esta página con tu cuenta de Claude</h2><p>Los entrenamientos se guardan en la cuenta. Inicia sesión en claude.ai y vuelve a abrir el link.</p></div></div>`;
const vistaError = () => `${marca()}<div class="wrap vista"><div class="vacio-caja"><h2>No se pudieron cargar los entrenamientos</h2><p>Revisa tu conexión y vuelve a abrir la página.</p></div></div>`;

/* ---------- alumnos ---------- */
function vistaAlumnos() {
  const as = alumnos();
  return `${marca()}<div class="wrap vista"><p class="intro">Cada alumno con sus propias rutinas.</p>
  ${APP ? avisosApp() : ''}
  ${as.length ? `<ul class="lista">${as.map((a) => `<li><a class="tarjeta" href="#${esc(a.id)}">
    <span class="avatar">${esc(iniciales(a.nombre))}</span>
    <span><h2>${esc(a.nombre)}${a.duo ? ' <span class="tag">Dúo</span>' : ''}${a.propia ? ' <span class="tag">Propio</span>' : ''}</h2><div class="meta">${pl(rutinasDe(a.id).length, 'rutina', 'rutinas')}${a.horario ? ' · ' + esc(a.horario) : ''}</div><div class="ejs">${esc(a.objetivo || '')}</div></span>
    <span class="chev" aria-hidden="true">›</span></a></li>`).join('')}</ul>` : '<div class="vacio-caja"><p>Todavía no hay alumnos.</p></div>'}
  ${puedeEditar() ? '<a class="btn-ghost" href="#nuevo-alumnos">+ Nuevo alumno</a>' : ''}
  ${APP ? '<a class="link-resp" href="#respaldo">Respaldo de datos</a>' : ''}</div>`;
}

/* ---------- versión app: instalar y respaldo ---------- */
let RESP_PENDIENTE = null;
const fechaCorta = (iso) => { const d = new Date(iso); return Number.isNaN(d.getTime()) ? '' : `${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}`; };

  if (APP.mostrarInstalar()) {

    <div class="grid2">${campo(am ? 'Veces' : 'Series', inp(`d.bloques.${i}.series`, b.series, '4', 'inputmode="numeric"'))}${campo('Descanso entre series (min)', inp(`d.bloques.${i}._entre`, b._entre, '1,5', 'inputmode="decimal"'))}</div>
    ${campo('Ejercicios', area(`d.bloques.${i}._ej`, b._ej, 'Uno por línea', filasDe(b._ej, 4)))}
  </section>`;
  }).join('')}
  <button type="button" class="btn-ghost" data-act="blqAgregar">+ Agregar bloque</button>
  <datalist id="modos"><option value="HIIT todos juntos"></option><option value="Estaciones"></option><option value="AMRAP"></option><option value="Circuito"></option></datalist>`;
}
function edClase(B) {
  const d = B.d;
  return `<div class="grid2">${campo('Fecha', `<input type="date" data-b="d.fecha" value="${esc(d.fecha)}">`)}${campo('Foco', inp('d.foco', d.foco, 'Ej: Foco piernas'))}</div>
  ${campo('Calentamiento', inp('d.cal', d.cal, CAL_CLASE))}
  <div class="chks">${chk('d.hecha', d.hecha, 'Realizada')}${chk('d.feriado', d.feriado, 'Feriado (sin clase)', 'data-cambio="1"')}</div>
  ${d.feriado ? '' : edBloques(d)}`;
}
function edBase(B) {
  const d = B.d;
  return `<div class="grid2 g-letra">${campo('Letra', inp('d.letra', d.letra, 'A', 'maxlength="8"'))}${campo('Realizada el', inp('d.hecha', d.hecha, '31 de mayo'))}</div>
  ${campo('Lugar', inp('d.sede', d.sede, 'Gimnasio o sede'))}
  ${campo('Calentamiento', inp('d.cal', d.cal, 'Movilidad y estiramientos'))}
  ${edBloques(d)}`;
}
const TITULO_ED = { alumnos: ['Nuevo alumno', 'Editar alumno'], rutinas: ['Nueva rutina', 'Editar rutina'], clases: ['Nueva clase', 'Editar clase'], base: ['Nueva rutina base', 'Editar rutina base'] };
const NOMBRE_DEL = { alumnos: 'Eliminar alumno y sus rutinas', rutinas: 'Eliminar rutina', clases: 'Eliminar clase', base: 'Eliminar rutina base' };
function vistaEditor(r) {
  if (!puedeEditar()) return `${barra('#' + (r.id || r.tab), 'Editar')}<div class="wrap vista"><div class="vacio-caja"><p>Esta página está en modo solo lectura para ti.</p></div></div>`;
  if (!BORRADOR || BORRADOR.ruta !== r.clave) {
    if (S.estado !== 'listo' && !hayDatos()) return vistaCargando();
    BORRADOR = crearBorrador(r);
    if (!BORRADOR) return `${barra('#' + r.tab, 'Editar')}<div class="wrap vista"><div class="vacio-caja"><p>Esto ya no existe. Puede que alguien lo haya eliminado.</p></div></div>`;
  }
  const B = BORRADOR;
  const cuerpo = B.col === 'alumnos' ? edAlumno(B) : B.col === 'rutinas' ? edRutina(B) : B.col === 'clases' ? edClase(B) : edBase(B);
  return `<header class="barra"><div class="wrap"><button type="button" class="volver" data-act="cancelar" aria-label="Cancelar">${ICON.back}</button><h1>${TITULO_ED[B.col][B.nuevo ? 0 : 1]}</h1></div></header>
  <div class="wrap vista editor">${cuerpo}
    ${B.nuevo ? '' : `<button type="button" class="btn-peligro" data-act="eliminar">${NOMBRE_DEL[B.col]}</button>`}
  </div>
  <div class="pie-ed"><button type="button" class="btn-sec" data-act="cancelar">Cancelar</button><button type="button" class="btn" data-act="guardar">Guardar</button></div>`;
}
function aDoc(B) {
  const d = clon(B.d); const t = B.txt;
  if (B.col === 'alumnos') {
    d.nombre = limpio(d.nombre);
    if (!d.nombre) return [null, 'Escribe el nombre del alumno'];
    ['objetivo', 'horario', 'veces', 'inicio', 'notaPesos'].forEach((k) => { d[k] = limpio(d[k]); });
    d.duo = !!d.duo;
    d.salud = lineas(t.salud);
    d.plan = lineas(t.plan).map((l) => { const k = l.indexOf(':'); return k > 0 ? { dia: l.slice(0, k).trim(), texto: l.slice(k + 1).trim() } : { dia: '', texto: l }; });
  }
  if (B.col === 'rutinas') {
    d.letra = limpio(d.letra); d.titulo = limpio(d.titulo); d.etiqueta = limpio(d.etiqueta);
    if (!d.letra) return [null, 'Ponle una letra a la rutina (A, B, C…)'];
    d.prox = lineas(t.prox);
    if (d.circuitos) {
      d.circuitos = d.circuitos.map((c) => ({ nombre: limpio(c.nombre), nota: limpio(c.nota), ej: lineas(c._ej).map((l) => { const [n, p, r] = l.split('|').map((x) => x.trim()); return { n: n || '', p: p || '', r: r || '' }; }).filter((e) => e.n) })).filter((c) => c.nombre || c.ej.length);
    } else {
      d.ej = (d.ej || []).map((e) => ({ ...e, n: limpio(e.n), plan: limpio(e.plan), h: e.h || [] })).filter((e) => e.n);
    }
  }
  if (B.col === 'clases' || B.col === 'base') {
    if (B.col === 'clases' && !/^\d{4}-\d{2}-\d{2}$/.test(d.fecha || '')) return [null, 'Elige la fecha de la clase'];
    if (B.col === 'base') { d.letra = limpio(d.letra); if (!d.letra) return [null, 'Ponle una letra a la rutina base']; d.hecha = limpio(d.hecha); d.sede = limpio(d.sede); }
    d.cal = limpio(d.cal); if (B.col === 'clases') { d.foco = limpio(d.foco); d.hecha = !!d.hecha; d.feriado = !!d.feriado; }
    d.bloques = d.feriado ? [] : (d.bloques || []).map((b) => {
      const o = { ej: lineas(b._ej) };
      if (limpio(b.nombre)) o.nombre = limpio(b.nombre);
      if (limpio(b.modo)) o.modo = limpio(b.modo);
      if (esAmrap(b)) { const m = numero(b.amrap); if (m) o.amrap = m; if (limpio(b.reps)) o.reps = limpio(b.reps); }
      else { const td = limpio(b._td); const mm = td.match(/^(\d+)\s*[-–/]\s*(\d+)$/); if (mm) { o.t = +mm[1]; o.d = +mm[2]; } else if (td) o.int = td; }
      const se = numero(b.series); if (se) o.series = Math.round(se);
      const en = numero(b._entre); if (en) o.entre = Math.round(en * 60);
      return o;
    }).filter((b) => b.ej.length || b.nombre);
  }
  d.modificado = new Date().toISOString();
  return [JSON.parse(JSON.stringify(d)), null];
}

/* ---------- escribir en la base ---------- */
function errorEscritura(e) {
  const code = e && e.code;
  if (code === 'invalid_argument' && S.puede !== true) { S.soloLectura = true; toast('No tienes permiso para editar esta página. Pídele a quien la comparte que te invite como editora.'); }
  else if (code === 'quota_exceeded') toast(APP ? 'No queda espacio en el celular para guardar. Borra algo antes de agregar más.' : 'Se llenó el espacio de la página. Borra algo antes de agregar más.');
  else if (code === 'revoked' || code === 'not_granted') { S.soloLectura = true; toast('Ya no tienes acceso para editar.'); }
  else toast('No se pudo guardar. Revisa tu conexión e inténtalo otra vez.');
}
async function conReintento(fn) {
  try { await fn(); return true; } catch (e) {
    if (e && e.code === 'unavailable') { await espera(500 + Math.random() * 700); try { await fn(); return true; } catch (e2) { errorEscritura(e2); return false; } }
    errorEscritura(e); return false;
  }
}
const escribir = (col, id, data) => conReintento(() => db.collection(col).doc(id).set(data));
const borrar = (col, id) => conReintento(() => db.collection(col).doc(id).delete());

/* ---------- acciones ---------- */
const ACT = {};
function repintarEditor() { const y = window.scrollY; pintar(); window.scrollTo(0, y); }
function mover(lista, i, dlt) { const j = i + dlt; if (j < 0 || j >= lista.length) return; [lista[i], lista[j]] = [lista[j], lista[i]]; }
ACT.ejMover = (el) => { mover(BORRADOR.d.ej, +el.dataset.i, +el.dataset.d); BORRADOR.sucio = true; repintarEditor(); };
ACT.ejQuitar = (el) => { BORRADOR.d.ej.splice(+el.dataset.i, 1); BORRADOR.sucio = true; repintarEditor(); };
ACT.ejAgregar = () => { BORRADOR.d.ej.push({ n: '', plan: '', h: [] }); BORRADOR.sucio = true; repintarEditor(); enfocar(`[data-b="d.ej.${BORRADOR.d.ej.length - 1}.n"]`); };
ACT.circMover = (el) => { mover(BORRADOR.d.circuitos, +el.dataset.i, +el.dataset.d); BORRADOR.sucio = true; repintarEditor(); };
ACT.circQuitar = (el) => { BORRADOR.d.circuitos.splice(+el.dataset.i, 1); BORRADOR.sucio = true; repintarEditor(); };
ACT.circAgregar = () => { BORRADOR.d.circuitos.push({ nombre: '', nota: '', ej: [], _ej: '' }); BORRADOR.sucio = true; repintarEditor(); enfocar(`[data-b="d.circuitos.${BORRADOR.d.circuitos.length - 1}.nombre"]`); };
ACT.blqMover = (el) => { mover(BORRADOR.d.bloques, +el.dataset.i, +el.dataset.d); BORRADOR.sucio = true; repintarEditor(); };
ACT.blqQuitar = (el) => { BORRADOR.d.bloques.splice(+el.dataset.i, 1); BORRADOR.sucio = true; repintarEditor(); };
ACT.blqAgregar = () => {
  const ant = BORRADOR.d.bloques[BORRADOR.d.bloques.length - 1];
  BORRADOR.d.bloques.push(ant && !esAmrap(ant) ? { ej: [], _ej: '', _td: ant._td || '', series: ant.series || '', _entre: ant._entre || '' } : { ej: [], _ej: '', _td: '40-20', series: 3, _entre: '2' });
  BORRADOR.sucio = true; repintarEditor(); enfocar(`[data-b="d.bloques.${BORRADOR.d.bloques.length - 1}._ej"]`);
};
function enfocar(sel) { const el = document.querySelector(sel); if (el) { el.focus({ preventScroll: true }); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }
function dosToques(el, texto, fn) {
  if (!el.dataset.seguro) {
    el.dataset.seguro = '1'; const original = el.textContent; el.textContent = texto; el.classList.add('on');
    setTimeout(() => { if (el.isConnected && el.dataset.seguro) { delete el.dataset.seguro; el.textContent = original; el.classList.remove('on'); } }, 4000);
    return;
  }
  fn();
}
ACT.cancelar = (el) => {
  if (!BORRADOR) { location.hash = '#alumnos'; return; }
  const salir = () => { const destino = PADRE(BORRADOR); BORRADOR = null; location.hash = destino; };
  if (BORRADOR.sucio && el.classList.contains('btn-sec')) dosToques(el, 'Toca otra vez para descartar', salir);
  else salir();
};
ACT.guardar = async (el) => {
  const B = BORRADOR;
  if (!B || B.guardando) return;
  const [doc, err] = aDoc(B);
  if (err) { toast(err); return; }
  B.guardando = true; el.disabled = true; el.textContent = 'Guardando…';
  const ok = await escribir(B.col, B.id, doc);
  if (ok) {
    S[B.col].set(B.id, { ...doc, id: B.id });
    BORRADOR = null;
    toast('Guardado ✓');
    location.hash = '#' + B.id;
  } else { B.guardando = false; if (el.isConnected) { el.disabled = false; el.textContent = 'Guardar'; } if (S.soloLectura) pintar(); }
};
ACT.eliminar = (el) => dosToques(el, 'Toca otra vez para eliminar', async () => {
  const B = BORRADOR; if (!B || B.guardando) return;
  B.guardando = true; el.disabled = true; el.textContent = 'Eliminando…';
  let ok = await borrar(B.col, B.id);
  if (ok && B.col === 'alumnos') for (const r of rutinasDe(B.id)) { if (!(await borrar('rutinas', r.id))) { ok = false; break; } S.rutinas.delete(r.id); }
  if (ok) {
    S[B.col].delete(B.id);
    const destino = B.col === 'alumnos' ? '#alumnos' : B.col === 'rutinas' ? '#' + B.d.alumnoId : '#funcional';
    BORRADOR = null; toast('Eliminado'); location.hash = destino;
  } else { B.guardando = false; if (el.isConnected) { el.disabled = false; el.textContent = NOMBRE_DEL[B.col]; delete el.dataset.seguro; el.classList.remove('on'); } }
});
ACT.duplicar = (el) => {
  const col = el.dataset.col; const doc = S[col].get(el.dataset.id); if (!doc) return;
  const d = clon(doc); delete d.id;
  const pref = { rutinas: 'ru', clases: 'cl', base: 'ba' }[col];
  const id = nuevoId(pref);
  if (col === 'rutinas') { d.letra = siguienteLetra(new Set(rutinasDe(d.alumnoId).map((x) => x.letra))) || d.letra; d.titulo = (d.titulo || '').trim(); }
  if (col === 'clases') { d.fecha = HOY; d.hecha = false; d.feriado = false; }
  if (col === 'base') { d.letra = siguienteLetra(new Set(bases().map((x) => x.letra))) || d.letra; d.hecha = ''; }
  const clave = `editar-${col}-${id}`;
  BORRADOR = { ruta: clave, col, id, nuevo: true, d, txt: textos(col, d), sucio: true };
  location.hash = '#' + clave;
  toast(col === 'clases' ? 'Copia lista: cambia la fecha y lo que necesites, y guarda' : 'Copia lista: cambia lo que necesites y guarda');
};
ACT.respaldoGuardar = async () => {
  const r = APP.exportar();
  const archivo = new File([r.texto], r.nombre, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) await navigator.share({ files: [archivo], title: 'Respaldo Inquieta' });
    else {
      const url = URL.createObjectURL(archivo); const a = document.createElement('a');
      a.href = url; a.download = r.nombre; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }
    APP.marcarRespaldo(); toast('Respaldo listo ✓'); pintar();
  } catch (err) { if (!err || err.name !== 'AbortError') toast('No se pudo guardar el respaldo. Inténtalo otra vez.'); }
};
ACT.respaldoCargar = (el) => dosToques(el, 'Toca otra vez para reemplazar', () => {
  const P = RESP_PENDIENTE; if (!P) return;
  try { APP.reemplazar(P.datos); } catch (err) { toast('No se pudo cargar: no queda espacio en el celular.'); return; }
  RESP_PENDIENTE = null; toast('Respaldo cargado ✓'); location.hash = '#alumnos';
});
ACT.respaldoDescartar = () => { RESP_PENDIENTE = null; pintar(); };
ACT.instalar = async () => { await APP.instalar(); pintar(); };
ACT.noInstalar = () => { APP.noInstalar(); pintar(); };
async function leerRespaldo(archivo) {
  if (!archivo) return;
  let texto = '';
  try { texto = await archivo.text(); } catch (err) { toast('No se pudo leer el archivo.'); return; }
  const r = APP.leerRespaldo(texto);
  if (r.error) { toast(r.error); pintar(); return; }
  RESP_PENDIENTE = r; pintar();
}

/* ---------- pintar ---------- */
let anterior = '';
function pintar() {
  const r = ruta();
  const misma = r.clave === anterior;
  if (anterior && !misma) scrolls[anterior] = window.scrollY;
  const yAntes = window.scrollY;
  let html;
  if (S.estado === 'sin-db') html = vistaSinDb();
  else if (r.edit) html = vistaEditor(r);
  else if (r.respaldo) html = vistaRespaldo();
  else if (r.espera || (!hayDatos() && (S.estado === 'cargando'))) html = vistaCargando();
  else if (!hayDatos() && S.estado === 'error') html = vistaError();
  else html = r.w ? vistaRutina(r.w) : r.a ? vistaAlumno(r.a) : r.c ? vistaClase(r.c) : r.tab === 'funcional' ? vistaFuncional() : vistaAlumnos();
  document.body.classList.toggle('editando', !!r.edit && !!BORRADOR);
  document.getElementById('app').innerHTML = (r.edit ? '' : aviso()) + html;
  document.getElementById('tabs').innerHTML = TABS.map((t) => `<a class="tab ${t.id === r.tab ? 'on' : ''}" href="#${t.id}" ${t.id === r.tab ? 'aria-current="page"' : ''}>${ICON[t.id]}${t.t}</a>`).join('');
  if (!r.w && !r.a && !r.c && !r.edit && !r.espera && !r.respaldo) { tabGuardada = r.tab; try { localStorage.setItem('inq-visor-tab3', r.tab); } catch (err) { /* sin almacenamiento */ } }
  if (misma) window.scrollTo(0, yAntes);
  else window.scrollTo(0, r.w || r.c || r.a || r.edit || r.respaldo ? 0 : scrolls[r.clave] || 0);
  anterior = r.clave;
}
let pendiente = false;
function alCambiarDatos() {
  if (pendiente) return; pendiente = true;
  requestAnimationFrame(() => {
    pendiente = false;
    const r = ruta();
    if (r.edit && BORRADOR && BORRADOR.ruta === r.clave) return; // no tocar un formulario abierto
    pintar();
  });
}
function toast(msg) {
  const t = document.getElementById('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), msg.length > 60 ? 6000 : 2800);
}

/* ---------- eventos ---------- */
function fijar(path, valor) {
  const p = path.split('.'); let o = BORRADOR;
  for (let i = 0; i < p.length - 1; i++) { const k = /^\d+$/.test(p[i]) ? +p[i] : p[i]; if (o[k] == null) o[k] = /^\d+$/.test(p[i + 1]) ? [] : {}; o = o[k]; }
  const k = p[p.length - 1]; o[/^\d+$/.test(k) ? +k : k] = valor;
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el);
});
document.addEventListener('input', (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.b || !BORRADOR) return;
  fijar(el.dataset.b, el.type === 'checkbox' ? el.checked : el.value); BORRADOR.sucio = true;
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (APP && el.dataset && el.dataset.archivo === 'respaldo') { leerRespaldo(el.files && el.files[0]); return; }
  if (!el.dataset || !el.dataset.b || !BORRADOR) return;
  fijar(el.dataset.b, el.type === 'checkbox' ? el.checked : el.value); BORRADOR.sucio = true;
  if (el.dataset.cambio) repintarEditor();
});
window.addEventListener('hashchange', () => {
  const r = ruta();
  if (!(r.edit && BORRADOR && BORRADOR.ruta === r.clave)) BORRADOR = null;
  pintar();
});

/* ---------- arranque ---------- */
async function iniciar() {
  pintar();
  let base = null; let usuario = null;
  if (APP) { base = APP.db; usuario = APP.usuario; addEventListener('inq-app', alCambiarDatos); }
  else {
    if (!window.claude || typeof window.claude.use !== 'function') { S.estado = 'sin-db'; pintar(); return; }
    [base, usuario] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  }
  db = base;
  if (!db) { S.estado = 'sin-db'; pintar(); return; }
  if (usuario) { try { S.puede = await usuario.can('data.write'); } catch (err) { S.puede = null; } }
  const timer = setTimeout(() => { if (S.estado !== 'listo') { S.lento = true; alCambiarDatos(); } }, 10000);
  COLS.forEach((col) => {
    db.collection(col).onSnapshot((snap) => {
      const m = new Map();
      snap.docs.forEach((d) => { if (d.exists) m.set(d.id, { ...d.data(), id: d.id }); });
      S[col] = m;
      if (!snap.metadata.fromCache) S.listo[col] = true;
      if (COLS.every((c) => S.listo[c])) { S.estado = 'listo'; S.lento = false; clearTimeout(timer); }
      alCambiarDatos();
    }, () => { S.estado = 'error'; clearTimeout(timer); alCambiarDatos(); });
  });
}
iniciar();

}
</script>
