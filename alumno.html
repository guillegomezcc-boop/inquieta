<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
@font-face { font-family: "Montserrat"; font-weight: 600; font-display: swap; src: url("/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 700; font-display: swap; src: url("/fonts/montserrat-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 800; font-display: swap; src: url("/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
:root {
  --bg: #F3F5F7; --surface: #FFFFFF; --text: #0F1217; --muted: #5A6472; --line: #DCE1E7; --head: #1F2937; --head-text: #F9FAFB;
  --brand: #00CFCB; --brand-ink: #04211F; --brand-text: #008E8A; --brand-soft: #DDF7F6; --ok: #0E9F6E;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 14px rgba(16, 24, 40, .07);
  --display: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0B0E13; --surface: #151A22; --text: #F2F4F7; --muted: #9AA4B2; --line: #283243; --head: #10151C; --brand: #1FD8D3; --brand-ink: #03201F; --brand-text: #45E2DD; --brand-soft: #0E2F30; --shadow: 0 1px 2px rgba(0, 0, 0, .5); color-scheme: dark; }
  :root:not([data-theme="light"]) .fig { --lz: rgba(255,255,255,.55); --sb: rgba(15,23,42,.13); --lz2: rgba(255,255,255,.1); --sb2: rgba(0,0,0,.2); --som: rgba(0,0,0,.4); --c1: #E8ECF1; --c2: #6F7A8A; --h2: #0F9C99; --e1: #CBD5E1; --e2: #8C98A8; --e3: #5B6676; --e4: #2C3646; --piso: #283243; }
  :root:not([data-theme="light"]) .mapa { --mz: #2F3947; --mb: #3B4656; --ms: #167A78; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.45 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cab { background: var(--head); color: var(--head-text); padding-top: env(safe-area-inset-top, 0px); }
.cab .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 14px; }
.logo { display: block; height: 28px; width: auto; }
.firma { font: 700 11px/1.35 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--brand); text-align: right; }
.hola { margin: 22px 0 0; font: 800 26px/1.15 var(--display); }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
.dias { display: flex; gap: 8px; margin: 18px -16px 0; padding: 0 16px 4px; overflow-x: auto; scrollbar-width: none; }
.dias::-webkit-scrollbar { display: none; }
.dia { flex: 0 0 auto; min-height: 46px; padding: 8px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 800 15px/1.15 var(--display); text-align: left; cursor: pointer; }
.dia small { display: block; margin-top: 2px; font: 600 12px/1.2 var(--body); color: var(--muted); }
.dia.on { background: var(--head); color: var(--head-text); border-color: transparent; }
.dia.on small { color: var(--brand); }
.prog { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin: 14px -16px 0; padding: 12px 16px; background: var(--bg); }
.prog-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 800 15px/1.2 var(--display); }
.prog-t span { font: 600 14px var(--body); color: var(--muted); }
.barra { height: 10px; margin-top: 8px; border-radius: 5px; background: var(--line); overflow: hidden; }
.barra i { display: block; height: 100%; width: 0; border-radius: 5px; background: var(--brand); transition: width .35s ease; }
.lista { display: grid; gap: 14px; margin: 4px 0 0; padding: 0; list-style: none; }
.ej { overflow: hidden; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); transition: opacity .2s; }
.ej-img { position: relative; aspect-ratio: 4 / 3; border-bottom: 1px solid var(--line); background: var(--surface); }
.ej-img .fig, .ej-img .foto { display: block; width: 100%; height: 100%; }
.ej-img .foto { object-fit: contain; background: #0B0E13; }
.ej-img .sin-fig { display: grid; place-items: center; height: 100%; padding: 14px; }
.ej-img .sin-fig .mapa { height: 100%; width: auto; }
.combo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100%; }
.combo > div { display: grid; place-items: center; min-width: 0; overflow: hidden; }
.combo > div + div { border-left: 1px dashed var(--line); }
.combo .fig, .combo .foto { width: 100%; height: 100%; }
.ej-num { position: absolute; top: 12px; left: 12px; min-width: 34px; height: 34px; padding: 0 8px; display: grid; place-items: center; border-radius: 12px; background: var(--head); color: var(--head-text); font: 800 16px/1 var(--display); }
.ej-mapa { position: absolute; right: 10px; bottom: 10px; width: 34px; height: 82px; padding: 4px 3px; border-radius: 10px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.ej-cuerpo { padding: 14px 16px 16px; }
.ej h3 { font-size: 20px; line-height: 1.2; }
.datos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.dato { display: grid; gap: 2px; min-width: 74px; padding: 8px 12px; border-radius: 12px; background: var(--brand-soft); }
.dato b { font: 800 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.dato span { font: 700 11px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--brand-text); }
.plan { margin-top: 10px; padding: 8px 12px; border-radius: 12px; background: var(--brand-soft); font-weight: 700; }
.tec { margin: 12px 0 0; font-size: 15px; }
.tec b { font: 800 11px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.mus { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.chk { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 54px; margin-top: 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--text); font: 800 17px/1 var(--display); cursor: pointer; }
.chk .c { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--line); font-size: 15px; color: transparent; }
.ej.hecho .chk { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.ej.hecho .chk .c { border-color: var(--brand-ink); color: var(--brand-ink); }
.ej.hecho .ej-img { opacity: .55; }
.fin { margin: 14px 0 0; padding: 16px; border-radius: 18px; background: var(--brand); color: var(--brand-ink); font: 800 18px/1.3 var(--display); text-align: center; }
.pie { margin: 26px 0 0; padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px)); text-align: center; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border: 0; border-radius: 16px; background: var(--head); color: var(--head-text); font: 800 16px/1 var(--display); cursor: pointer; }
.btn:disabled { opacity: .6; }
.btn svg { width: 20px; height: 20px; }
.nota { margin: 12px 0 0; font-size: 13px; color: var(--muted); }
.caja { margin-top: 28px; padding: 22px 18px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
.caja h2 { font-size: 20px; margin-bottom: 6px; }
.caja p { margin: 0; color: var(--muted); }
.fig, .mapa { display: block; width: 100%; height: auto; }
.fig { --c1: #1F2937; --c2: #8A94A3; --h1: #00CFCB; --h2: #7FE3E1; --e1: #334155; --e2: #64748B; --e3: #94A3B8; --e4: #D7DDE5; --bd: #F59E0B; --fbg: var(--surface); --piso: #E3E7EC; }
.fig .f1 { fill: var(--c1); stroke: var(--c1); } .fig .f2 { fill: var(--c2); stroke: var(--c2); }
.fig .h1 { fill: var(--h1); stroke: var(--h1); } .fig .h2 { fill: var(--h2); stroke: var(--h2); }
.fig .b1 { fill: var(--c1); stroke: none; } .fig .b2 { fill: var(--c2); stroke: none; } .fig .ol, .fig .ol2 { stroke: var(--fbg); }
.fig { --lz: rgba(255,255,255,.14); --sb: rgba(0,0,0,.22); --lz2: rgba(255,255,255,.2); --sb2: rgba(31,41,55,.14); --h1o: #00A9A6; --som: rgba(31,41,55,.13); }
.fig .lz { fill: var(--lz); } .fig .sb { fill: var(--sb); } .fig .lz2 { fill: var(--lz2); } .fig .sb2 { fill: var(--sb2); } .fig .som { fill: var(--som); }
.fig .h1 { stroke: var(--h1o); }
.fig .e1 { fill: var(--e1); stroke: var(--e1); } .fig .e2 { fill: var(--e2); stroke: var(--e2); } .fig .e3 { fill: var(--e3); stroke: var(--e3); } .fig .e4 { fill: var(--e4); stroke: var(--e4); }
.fig .bg { fill: var(--fbg); stroke: var(--fbg); } .fig .hl { stroke: var(--fbg); } .fig .bd { stroke: var(--bd); } .fig .piso { stroke: var(--piso); }
.fig .ln { fill: none; stroke-linecap: round; stroke-linejoin: round; } .fig .tf { stroke-linejoin: round; }
.mapa { --mz: #DDE2E8; --mb: #CDD4DD; --mp: #00CFCB; --ms: #9FEAE8; }
.mapa .mb, .mapa .mz { fill: var(--mz); } .mapa .mb { fill: var(--mb); } .mapa .mz.mp { fill: var(--mp); } .mapa .mz.ms { fill: var(--ms); }
.mapa .mi circle { fill: var(--mp); } .mapa .mil { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cargando { margin-top: 40px; text-align: center; color: var(--muted); }
/* ---------- entrenamiento guiado ---------- */
.empezar { display: grid; gap: 4px; width: 100%; margin-top: 16px; padding: 16px 18px; border: 0; border-radius: 18px; background: var(--brand); color: var(--brand-ink); text-align: left; cursor: pointer; box-shadow: var(--shadow); }
.empezar b { font: 800 19px/1.2 var(--display); }
.empezar span { font-size: 14px; opacity: .85; }
.enviado { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: var(--brand-soft); font: 700 14px/1.35 var(--body); }
.g-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; margin: 0 -16px; padding: 12px 16px 10px; background: var(--bg); }
.g-fila { display: flex; align-items: center; gap: 10px; }
.g-fase { flex: 1; min-width: 0; font: 800 15px/1.2 var(--display); }
.g-fase small { display: block; font: 600 13px/1.3 var(--body); color: var(--muted); }
.g-x { flex: 0 0 44px; height: 44px; border: 0; border-radius: 14px; background: var(--surface); color: var(--text); font: 800 18px/1 var(--display); cursor: pointer; box-shadow: var(--shadow); }
.g-barras { display: grid; grid-template-columns: 2fr 5fr 2fr; gap: 4px; margin-top: 10px; }
.g-barras span { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.g-barras i { display: block; height: 100%; background: var(--brand); }
.g-card { margin-top: 8px; overflow: hidden; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); }
.g-img { position: relative; aspect-ratio: 4 / 3; border-bottom: 1px solid var(--line); }
.g-img .fig, .g-img .foto { display: block; width: 100%; height: 100%; }
.g-img .foto { object-fit: contain; background: #0B0E13; }
.g-cuerpo { padding: 14px 16px 18px; }
.g-cuerpo h2 { font-size: 22px; line-height: 1.2; }
.g-txt { margin: 10px 0 0; font-size: 16px; }
.lados { display: inline-block; margin-top: 10px; padding: 5px 10px; border-radius: 10px; background: #FEF3C7; color: #5B4300; font: 800 12px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.reloj { display: grid; place-items: center; gap: 6px; margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--bg); }
.reloj b { font: 800 46px/1 var(--display); font-variant-numeric: tabular-nums; }
.reloj small { font: 700 13px/1.2 var(--display); color: var(--brand-text); letter-spacing: .08em; text-transform: uppercase; }
.btn-sec { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--text); font: 800 16px/1 var(--display); cursor: pointer; }
.btn-brand { background: var(--brand); color: var(--brand-ink); }
.g-nav { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; margin-top: 14px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.g-link { display: block; width: 100%; margin-top: 8px; padding: 10px; border: 0; background: none; color: var(--muted); font: 600 14px var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.reg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.reg label { display: grid; gap: 4px; min-width: 0; font: 700 11px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.reg input { width: 100%; min-width: 0; min-height: 46px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 700 17px/1.2 var(--body); text-align: center; }
.paso { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; align-items: center; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.paso button { height: 46px; border: 0; background: var(--bg); color: var(--text); font: 800 20px/1 var(--display); cursor: pointer; }
.paso output { text-align: center; font: 800 18px/1 var(--display); color: var(--text); }
.rpe-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font: 800 13px/1 var(--display); }
.fondo { position: fixed; inset: 0; z-index: 30; background: rgba(5, 8, 12, .45); }
.hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 720px; margin: 0 auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); border-radius: 22px 22px 0 0; background: var(--surface); box-shadow: 0 -8px 30px rgba(0, 0, 0, .2); animation: sube .22s ease-out; }
@keyframes sube { from { transform: translateY(30px); opacity: .4; } }
.hoja h2 { font-size: 20px; }
.hoja p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.rpe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.rpe button { aspect-ratio: 1; min-height: 52px; border: 3px solid transparent; border-radius: 16px; color: #fff; font: 800 24px/1 var(--display); cursor: pointer; opacity: .9; }
.rpe button.on { border-color: var(--text); opacity: 1; transform: scale(1.06); box-shadow: 0 4px 12px rgba(0, 0, 0, .25); }
.rpe-txt { min-height: 26px; margin-top: 12px; text-align: center; font: 800 18px/1.3 var(--display); }
.hoja .btn { margin-top: 12px; }
.res { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.res div { padding: 12px; border-radius: 14px; background: var(--brand-soft); }
.res b { display: block; font: 800 22px/1.1 var(--display); }
.res span { font: 700 11px/1.2 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--brand-text); }
.res .ancho { grid-column: 1 / -1; }
.res-lista { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.res-lista li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-size: 15px; }
.res-lista small { display: block; color: var(--muted); font-size: 13px; }
textarea.obs { width: 100%; min-height: 84px; margin-top: 14px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 16px/1.4 var(--body); resize: vertical; }
.ok-caja { margin-top: 18px; padding: 18px; border-radius: 18px; background: var(--brand); color: var(--brand-ink); text-align: center; font: 800 18px/1.35 var(--display); }
@media (prefers-reduced-motion: reduce) { .fig animate, .fig animateTransform { display: none; } }

<body>
<header class="cab"><div class="wrap"><img class="logo" src="/img/logo-claro.png" alt="Inquieta" width="480" height="121"><div class="firma">Fernanda Rojas<br>Entrenamiento Personal</div></div></header>
<main id="app" class="wrap"><p class="cargando">Cargando tu rutina…</p></main>
<script>
/* Inquieta · dibujos propios de los ejercicios (SVG) y mapa de músculos.
   Nada de fotos de terceros: cada ejercicio se dibuja aquí, con la marca, a partir de dos o más posturas.
   FIG.figura(ej, {animar}) → SVG del ejercicio · FIG.mapa(principales, secundarios) → cuerpo de frente y de espalda. */
const FIG = (() => {
  const L = { muslo: 18, pierna: 17, torso: 23, cuello: 2.4, cabeza: 5.4, brazo: 13, antebrazo: 12, pie: 5.2, hombro: 7.2, cadera: 4.2 };
  const PISO = 84;
  const rad = (g) => (g * Math.PI) / 180;
  const r1 = (n) => Math.round(n * 10) / 10;
  const suma = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const por = (a, k) => [a[0] * k, a[1] * k];
  const lp = (a, b, t) => a + (b - a) * t;
  const lpP = (a, b, t) => [lp(a[0], b[0], t), lp(a[1], b[1], t)];
  const unit = (v) => { const n = Math.hypot(v[0], v[1]) || 1; return [v[0] / n, v[1] / n]; };
  const pt = (a, b) => a[0] * b[0] + a[1] * b[1];
  const P = (p) => `${r1(p[0])} ${r1(p[1])}`;

  // Dos huesos (raíz → articulación → punta). La articulación va hacia «pref».
  function ik(r, t, a, b, pref) {
    const dx = t[0] - r[0]; const dy = t[1] - r[1];
    const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(a - b) + 0.01), a + b - 0.01);
    const ang = Math.atan2(dy, dx);
    const A = Math.acos(Math.max(-1, Math.min(1, (a * a + d * d - b * b) / (2 * a * d))));
    const c1 = [r[0] + a * Math.cos(ang + A), r[1] + a * Math.sin(ang + A)];
    const c2 = [r[0] + a * Math.cos(ang - A), r[1] + a * Math.sin(ang - A)];
    const j = pt([c1[0] - r[0], c1[1] - r[1]], pref) >= pt([c2[0] - r[0], c2[1] - r[1]], pref) ? c1 : c2;
    const a2 = Math.atan2(t[1] - j[1], t[0] - j[0]);
    return [j, [j[0] + b * Math.cos(a2), j[1] + b * Math.sin(a2)]];
  }

  /* ---------- postura → esqueleto ----------
     Postura: v 'l' (de lado, mirando a la derecha) o 'f' (de frente) · c cadera · t ángulo del torso (90 = erguido,
     0 = horizontal con la cabeza a la derecha, 180 = horizontal con la cabeza a la izquierda) · cab giro de la cabeza ·
     cu curva de la espalda · p pies y m manos ([x, y] o relativo ['h'|'c'|'k', adelante, abajo]) · ko/co preferencia
     de rodillas/codos (1 adelante, -1 atrás o vector) · pie ángulo de los pies (0 = derecha, 90 = abajo). */
  function base(Q) {
    const tg = Q.t ?? 90; const t = rad(tg);
    const u = [Math.cos(t), -Math.sin(t)];
    const sg = Q.sup ? -1 : 1;
    const fw = [sg * Math.sin(t), sg * Math.cos(t)];
    const lat = [Math.sin(t), Math.cos(t)];
    const c = Q.c || [58, 47];
    const h = suma(c, por(u, L.torso * (Q.tl || 1)));
    const tk = rad(tg + (Q.cab || 0));
    const k = suma(h, por([Math.cos(tk), -Math.sin(tk)], L.cuello + L.cabeza));
    return { tg, u, fw, lat, c, h, k, dn: por(u, -1) };
  }
  function res(s, b) {
    if (!s) return null;
    if (typeof s[0] !== 'string') return s;
    const o = s[0] === 'h' ? b.h : s[0] === 'k' ? b.k : b.c;
    const ax = Q2v(b);
    return suma(suma(o, por(ax, s[1])), por(b.dn, s[2]));
  }
  const Q2v = (b) => (b.v === 'f' ? b.lat : b.fw);
  const pref = (v, b, def) => (v == null ? def : Array.isArray(v) ? v : por(b.fw, v));

    if (a === 'saltarFase') { const P = pasos(); const k = P.findIndex(([x], j) => j > G.paso && x !== t); pararReloj(); G.paso = k; if (P[k][0] === 'fin') G.fin = new Date().toISOString(); guardarG(); pintar(); window.scrollTo({ top: 0 }); return true; }
    if (a === 'reloj') {
      const it = (t === 'cal' ? CAL : EST)[i]; pararReloj();
      RELOJ = { k: `${t}${i}`, ti: it.ti, lados: !!it.lados, lado: 1, fin: Date.now() + it.ti * 1000, listo: false };
      RELOJ.int = setInterval(tickReloj, 250); pita(1500, 0.12); pintar(); return true;
    }
    if (a === 'serie') { const r = G.ej[i]; r.series = Math.max(0, Math.min(20, (+r.series || 0) + +b.dataset.d)); guardarG(); b.parentElement.querySelector('output').textContent = r.series; return true; }
    if (a === 'termine') { if (G.ej[i].rpe) { ir(1); return true; } G.ej[i].hecho = true; RPE_SEL = 0; guardarG(); pintar(); return true; }
    if (a === 'rpe') { RPE_SEL = G.ej[i].rpe || 0; pintar(); return true; }
    if (a === 'rpeElegir') { RPE_SEL = +b.dataset.n; if (navigator.vibrate) navigator.vibrate(10); pintar(); return true; }
    if (a === 'rpeOk') { G.ej[i].rpe = RPE_SEL; G.ej[i].hecho = true; RPE_SEL = null; guardarG(); ir(1); return true; }
    if (a === 'rpeNo') { RPE_SEL = null; ir(1); return true; }
    if (a === 'rpeCerrar') { RPE_SEL = null; pintar(); return true; }
    if (a === 'saltarEj') { G.ej[i].hecho = false; G.ej[i].rpe = null; ir(1); return true; }
    if (a === 'enviar') { enviar(b); return true; }
    return false;
  }
  app.addEventListener('input', (e) => {
    const k = e.target.dataset && e.target.dataset.gc; if (!k || !G) return;
    if (k === 'obs') G.obs = e.target.value.slice(0, 600);
    else { const [t, i] = pasos()[G.paso]; if (t === 'ej') G.ej[i][k] = e.target.value.slice(0, 40); }
    guardarG();
  });

  /* ---------- PDF con imágenes y logo ---------- */
  const ESTILO = '.fig .f1{fill:#1F2937;stroke:#1F2937}.fig .f2{fill:#8A94A3;stroke:#8A94A3}.fig .h1{fill:#00CFCB;stroke:#00A9A6}.fig .lz{fill:rgba(255,255,255,.14)}.fig .sb{fill:rgba(0,0,0,.22)}.fig .lz2{fill:rgba(255,255,255,.2)}.fig .sb2{fill:rgba(31,41,55,.14)}.fig .som{fill:rgba(31,41,55,.13)}.fig .h2{fill:#7FE3E1;stroke:#7FE3E1}.fig .b1{fill:#1F2937;stroke:none}.fig .b2{fill:#8A94A3;stroke:none}.fig .ol,.fig .ol2{stroke:#fff}.fig .e1{fill:#334155;stroke:#334155}.fig .e2{fill:#64748B;stroke:#64748B}.fig .e3{fill:#94A3B8;stroke:#94A3B8}.fig .e4{fill:#D7DDE5;stroke:#D7DDE5}.fig .bg{fill:#fff;stroke:#fff}.fig .hl{stroke:#fff}.fig .bd{stroke:#F59E0B}.fig .piso{stroke:#E3E7EC}.fig .ln{fill:none;stroke-linecap:round;stroke-linejoin:round}.fig .tf{stroke-linejoin:round}.mapa .mb{fill:#CDD4DD}.mapa .mz{fill:#DDE2E8}.mapa .mz.mp{fill:#00CFCB}.mapa .mz.ms{fill:#9FEAE8}.mapa .mi circle{fill:#00CFCB}.mapa .mil{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}';
  const cargarScript = (src) => new Promise((ok, mal) => { if (window.jspdf) { ok(); return; } const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar')); document.head.appendChild(s); });
  const lienzo = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); return [c, x]; };
  function svgAJpg(svg, w, h) {
    const s = svg.replace(/^<svg /, `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" `).replace(/^(<svg[^>]*>)/, `$1<style>${ESTILO}</style>`);
    return new Promise((ok, mal) => {
      const im = new Image();
      im.onload = () => { const [c, x] = lienzo(w, h); x.drawImage(im, 0, 0, w, h); ok(c.toDataURL('image/jpeg', 0.9)); };
      im.onerror = () => mal(new Error('svg'));
      im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
    });
  }
  async function fotoAJpg(url, w, h) {
    const b = await (await fetch(url)).blob();
    const bmp = await createImageBitmap(b);
    const [c, x] = lienzo(w, h);
    const k = Math.min(w / bmp.width, h / bmp.height); const dw = bmp.width * k; const dh = bmp.height * k;
    x.drawImage(bmp, (w - dw) / 2, (h - dh) / 2, dw, dh);
    return c.toDataURL('image/jpeg', 0.85);
  }
  async function imgUna(x, w, h) {
    if (x.img) return await fotoAJpg(`${API}/img/${x.img}`, w, h);
    if (x.fig) return await svgAJpg(FIG.figura(x.fig, { animar: false }), w, h);
    return await svgAJpg(FIG.mapa(x.m, x.s, { lado: 'auto', icono: icono(x.g) }), w, h);
  }
  const ponerEn = (g, src, dx, dy, w, h) => new Promise((ok) => { if (!src) { ok(); return; } const im = new Image(); im.onload = () => { g.drawImage(im, dx, dy, w, h); ok(); }; im.onerror = () => ok(); im.src = src; });
  async function imgPdf(x) {
    try {
      if (x.combo) { // superserie: los dos monitos en la misma imagen
        const [a, b] = await Promise.all(x.combo.map((y) => imgUna(y, 240, 180).catch(() => null)));
        const [c, g] = lienzo(480, 360);
        await ponerEn(g, a, 0, 90, 240, 180); await ponerEn(g, b, 240, 90, 240, 180);
        g.strokeStyle = '#DCE1E7'; g.lineWidth = 2; g.setLineDash([8, 8]); g.beginPath(); g.moveTo(240, 50); g.lineTo(240, 310); g.stroke();
        return c.toDataURL('image/jpeg', 0.9);
      }
      return await imgUna(x, 480, 360);
    } catch (e) { return null; }
  }
  async function logoPdf() {
    try { const b = await (await fetch(BASE + 'img/logo-oscuro.png')).blob(); return await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); }); } catch (e) { return null; }
  }
  const sinEmoji = (s) => String(s || '').replace(/[^\u0000-ɏ–—‘-„•…]/g, '').replace(/\s+/g, ' ').trim();
  async function hacerPdf(btn) {
    const txt = btn.innerHTML; btn.disabled = true; btn.lastChild.textContent = 'Preparando el PDF…';
    try {
      await cargarScript(BASE + 'vendor/jspdf.umd.min.js');
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const W = 210; const H = 297; const M = 14;
      const logo = await logoPdf();
      const cabecera = () => {
        doc.setFillColor(0, 207, 203); doc.rect(0, 0, W, 3, 'F');
        if (logo) doc.addImage(logo, 'PNG', M, 9, 40, 10.1);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(0, 142, 138);
        doc.text('FERNANDA ROJAS · ENTRENAMIENTO PERSONAL', W - M, 15.5, { align: 'right' });
      };
      cabecera();
      let y = 34;
      doc.setTextColor(15, 18, 23); doc.setFont('helvetica', 'bold'); doc.setFontSize(20);
      doc.text(sinEmoji(`Rutina de ${R.nombre}`), M, y); y += 7;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(90, 100, 114);
      const f = R.actualizado ? new Date(R.actualizado) : new Date();
      doc.text(`Actualizada el ${f.getDate()} ${MES[f.getMonth()]} ${f.getFullYear()}`, M, y); y += 8;
      const nueva = () => { doc.addPage(); cabecera(); y = 28; };
      for (let di = 0; di < R.dias.length; di++) {
        const D = R.dias[di];
        if (y > H - 50) nueva();
        doc.setFillColor(31, 41, 55); doc.roundedRect(M, y, W - 2 * M, 10, 2, 2, 'F');
        doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(12);
        doc.text(sinEmoji(`Día ${di + 1}${D.titulo && !/^d[ií]a \d+$/i.test(D.titulo) ? ' · ' + D.titulo : ''}`), M + 4, y + 6.8); y += 15;
        for (let i = 0; i < D.ej.length; i++) {
          const e = D.ej[i]; const x = info(e);
          const det = [e.se ? `${e.se} series` : '', e.ti ? seg(e.ti) : e.re && e.se ? `${e.re}${conUnidad(e.re) ? '' : ' reps'}` : '', e.pe || '', e.de && e.se ? `descanso ${seg(e.de)}` : ''].filter(Boolean).join('  ·  ') || e.plan || '';
          doc.setFontSize(9);
          const notas = x.nota ? doc.splitTextToSize(sinEmoji('Técnica: ' + x.nota), W - 2 * M - 46) : [];
          const alto = Math.max(30, 17 + notas.length * 4 + (x.m.length ? 5 : 0));
          if (y + alto > H - 14) nueva();
          const im = await imgPdf(x);
          doc.setDrawColor(220, 225, 231); doc.setLineWidth(0.3); doc.roundedRect(M, y, 40, 30, 2, 2, 'S');
          if (im) doc.addImage(im, 'JPEG', M + 0.6, y + 0.6, 38.8, 28.8);
          const tx = M + 46; let ty = y + 6;
          doc.setTextColor(15, 18, 23); doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5);
          doc.text(sinEmoji(`${i + 1}. ${e.n}`), tx, ty, { maxWidth: W - M - tx }); ty += 6.5;
          doc.setFontSize(10.5); doc.setTextColor(0, 142, 138); doc.text(sinEmoji(det), tx, ty, { maxWidth: W - M - tx }); ty += 6;
          doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(60, 68, 80);
          if (notas.length) { doc.text(notas, tx, ty); ty += notas.length * 4; }
          if (x.m.length) { doc.setTextColor(120, 128, 140); doc.text(sinEmoji('Trabaja: ' + x.m.map((k) => EJ.MUS[k] || k).join(', ')), tx, ty + 1); }
          y += alto + 5;
          doc.setDrawColor(235, 238, 242); doc.line(M, y - 2.5, W - M, y - 2.5);
        }
        y += 4;
      }
      const n = doc.getNumberOfPages();
      for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFontSize(8); doc.setTextColor(150, 156, 166); doc.text(`Página ${p} de ${n}`, W - M, H - 8, { align: 'right' }); }
      doc.save(sinEmoji(`Rutina ${R.nombre}`).replace(/[^\w\- áéíóúñÁÉÍÓÚÑ]/g, '') + '.pdf');
    } catch (err) {
      const n = btn.parentElement.querySelector('.nota'); if (n) n.textContent = 'No se pudo crear el PDF. Revisa tu conexión e inténtalo otra vez.';
    } finally { btn.disabled = false; btn.innerHTML = txt; }
  }

  async function iniciar() {
    if (!token) { app.innerHTML = '<div class="caja"><h2>Link incompleto</h2><p>Abre el link tal como te llegó por WhatsApp.</p></div>'; return; }
    try {
      const r = await fetch(`${API}/r/${token}`, { cache: 'no-store' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { app.innerHTML = `<div class="caja"><h2>No encontramos tu rutina</h2><p>${esc(j.mensaje || 'Revisa el link o pídele uno nuevo a tu entrenadora.')}</p></div>`; return; }
      R = j; R.dias = (R.dias || []).filter((d) => (d.ej || []).length);
      enviarCola();
      dia = Math.min(+leer(claveDia(), 0) || 0, Math.max(0, R.dias.length - 1));
      document.title = `Rutina de ${R.nombre} · Fernanda Rojas`;
      pintar();
    } catch (e) {
      app.innerHTML = '<div class="caja"><h2>Sin conexión</h2><p>No pudimos cargar tu rutina. Revisa tu internet y vuelve a abrir el link.</p></div>';
    }
  }
  iniciar();
})();
